name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      AI_SERVICE_API_KEY: test-api-key
      AI_SERVICE_PREDICTION_PROVIDER: deterministic

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Synchronize locked environment
        run: uv sync --locked

      - name: Check Ruff linting
        run: uv run python -m ruff check .

      - name: Check Ruff formatting
        run: uv run python -m ruff format --check .

      - name: Check types with mypy
        run: uv run python -m mypy src tests

      - name: Run tests
        run: uv run python -m pytest -q

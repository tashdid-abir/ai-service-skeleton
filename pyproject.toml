[project]
name = "ai-service-skeleton"
version = "0.1.0"
description = "A modular AI service framework providing core configurations, schema validation, client management, and REST API utilities for building scalable AI applications."
readme = "README.md"
authors = [
    { name = "Ayubur Rahman Tashdid", email = "tashdidr3@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2>=2.12.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
ai-service-skeleton = "ai_service_skeleton.main:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.uv]
# OneDrive rejects uv's default Windows hardlinks. Copying packages is reliable
# here and keeps the project environment independent of uv's cache.
link-mode = "copy"

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

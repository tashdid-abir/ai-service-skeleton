[project]
name = "ai-service-skeleton"
version = "0.1.0"
description = "A modular AI service framework providing core configurations, schema validation, client management, and REST API utilities for building scalable AI applications."
readme = "README.md"
authors = [
    { name = "Ayubur Rahman Tashdid", email = "tashdidr3@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2>=2.12.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
ai-service-skeleton = "ai_service_skeleton:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
